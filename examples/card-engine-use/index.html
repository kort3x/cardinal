<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cardinal · Example Consumer</title>
    <link rel="stylesheet" href="/packages/card-engine/src/styles.css">
    <style>
      :root { color: #f7f4e9; background: #101923; font-family: system-ui, sans-serif; }
      body { margin: 0; }
      main { width: min(900px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0; }
      #stage { position: relative; width: 100%; height: 500px; border: 1px solid #314c55; border-radius: 18px; background: radial-gradient(circle at 50% 35%, #244554, #142631 70%); }
      button { border: 1px solid #45616a; border-radius: 8px; padding: 9px 12px; color: #f7f4e9; background: #1b303c; font: inherit; cursor: pointer; }
      button:hover, button:focus-visible { border-color: #f4c95d; }
      #status { color: #f4c95d; }
    </style>
  </head>
  <body>
    <main>
      <h1>Independent Cardinal Consumer</h1>
      <p>This example uses the public scene interface without lab-specific state.</p>
      <button id="flip" type="button">Flip card</button>
      <button id="spin" type="button" aria-pressed="false">Spin in place</button>
      <p id="status" aria-live="polite"></p>
      <div id="stage" aria-label="Example card stage"></div>
    </main>
    <script type="importmap">
      {
        "imports": {
          "three": "/packages/card-engine/node_modules/three/build/three.module.js",
          "three/addons/": "/packages/card-engine/node_modules/three/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="/examples/card-engine-use/main.js"></script>
  </body>
</html>
